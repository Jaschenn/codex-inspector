name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Native macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - uses: actions/cache@v4
        with:
          path: macapp/.build
          key: swift-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('macapp/Package.resolved') }}
      - name: Rust formatting
        run: cargo fmt --manifest-path rust-core/Cargo.toml --check
      - name: Rust static checks
        run: cargo clippy --manifest-path rust-core/Cargo.toml --locked --target ${{ matrix.target }} -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path rust-core/Cargo.toml --locked --target ${{ matrix.target }}
      - name: Swift tests
        run: swift test --package-path macapp --only-use-versions-from-resolved-file
      - name: Install dependency notice generator
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Package native application
        env:
          CODEX_INSPECTOR_ARCH: ${{ matrix.arch }}
        run: macapp/build_app.sh
      - name: Upload application and Rust CLI
        uses: actions/upload-artifact@v4
        with:
          name: CodexInspector-macos-${{ matrix.arch }}
          path: |
            macapp/dist/CodexInspector-macos-${{ matrix.arch }}.zip
            macapp/dist/CodexInspector-macos-${{ matrix.arch }}.zip.sha256
            macapp/dist/codex-inspector-core-macos-${{ matrix.arch }}.tar.gz
            macapp/dist/codex-inspector-core-macos-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
