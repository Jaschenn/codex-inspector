name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Install dependency notice generator
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Package application
        env:
          CODEX_INSPECTOR_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export CODEX_INSPECTOR_VERSION="${GITHUB_REF_NAME#v}"
          fi
          macapp/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            macapp/dist/*.zip
            macapp/dist/*.sha256
            macapp/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            原生 SwiftUI 界面 + Rust 检查引擎，无 Python 或浏览器运行时。
            Apple Silicon 下载 arm64，Intel Mac 下载 x86_64；需要 macOS 13 或更高版本。
            解压后将 CodexInspector.app 放入应用程序目录。
            当前使用 ad-hoc 签名，尚未进行 Apple 公证。首次打开如被阻止，
            在系统设置 → 隐私与安全性中允许打开。
            同时提供独立 Rust 命令行引擎及 SHA-256 校验文件。
