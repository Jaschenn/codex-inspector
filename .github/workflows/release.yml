name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core
      - name: Install dependency notice generator
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Validate release
        run: |
          cargo fmt --manifest-path rust-core/Cargo.toml --check
          cargo clippy --manifest-path rust-core/Cargo.toml --locked --all-targets --target ${{ matrix.target }} -- -D warnings
          cargo test --manifest-path rust-core/Cargo.toml --locked --target ${{ matrix.target }}
          swift test -c release --package-path macapp --only-use-versions-from-resolved-file
      - name: Package application
        env:
          CODEX_INSPECTOR_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            export CODEX_INSPECTOR_VERSION="${GITHUB_REF_NAME#v}"
          fi
          macapp/build_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            macapp/dist/*.zip
            macapp/dist/*.sha256
            macapp/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          body: |
            原生 SwiftUI 界面 + Rust 检查引擎，无 Python 或浏览器运行时。
            Apple Silicon 下载 arm64，Intel Mac 下载 x86_64；需要 macOS 13 或更高版本。
            解压后将 CodexInspector.app 放入应用程序目录。
            当前使用 ad-hoc 签名，尚未进行 Apple 公证。首次打开如被阻止，
            在系统设置 → 隐私与安全性中允许打开。
            同时提供独立 Rust 命令行引擎及 SHA-256 校验文件。

  homebrew:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check Homebrew tap token
        id: tap
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN is not configured; skipping the Homebrew tap update."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify tap repository
        if: steps.tap.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if ! git ls-remote "https://x-access-token:${TOKEN}@github.com/Jaschenn/homebrew-tap.git" HEAD >/dev/null 2>&1; then
            echo "::error::Jaschenn/homebrew-tap is missing or the token cannot read it. Create the tap repository once and grant HOMEBREW_TAP_TOKEN contents: write."
            exit 1
          fi
      - name: Check out tap repository
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Jaschenn/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Check out source repository
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          path: source
      - name: Download release artifacts
        if: steps.tap.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Render cask
        if: steps.tap.outputs.enabled == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_SHA="$(awk 'NR == 1 { print $1 }' release/CodexInspector-macos-arm64.zip.sha256)"
          INTEL_SHA="$(awk 'NR == 1 { print $1 }' release/CodexInspector-macos-x86_64.zip.sha256)"
          bash source/scripts/render_homebrew_cask.sh \
            "$VERSION" "$ARM_SHA" "$INTEL_SHA" tap/Casks/codex-inspector.rb
      - name: Commit and push cask
        if: steps.tap.outputs.enabled == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/codex-inspector.rb
          if git diff --cached --quiet; then
            echo "Cask is already up to date."
            exit 0
          fi
          git commit -m "Update codex-inspector to ${GITHUB_REF_NAME#v}"
          git push
