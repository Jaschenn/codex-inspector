name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: 构建 Python 包(命令行版,PyPI 风格 wheel/sdist)
        run: uv build

      - name: 打包 macOS 菜单栏 App(自包含,内置 Python 运行时)
        # 特意放在 `uv build` 之后:这一步会在仓库里生成 macapp/dist(几十 MB 的 .app)
        # 和 macapp/.build(几百 MB 的编译缓存),不想让它们有任何机会被后面的打包步骤
        # 扫进去。
        run: macapp/build_app.sh

      - name: 压缩 .app
        run: ditto -c -k --sequesterRsrc --keepParent macapp/dist/CodexInspector.app CodexInspector-macos-arm64.zip

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CodexInspector-macos-arm64.zip
            dist/*.whl
            dist/*.tar.gz
          body: |
            ## 安装方式

            **菜单栏 App(推荐,免装 Python)**

            下载 `CodexInspector-macos-arm64.zip`,解压后把 `CodexInspector.app` 拖进
            "应用程序" 文件夹。首次运行会被 Gatekeeper 拦截(没有做 Apple 开发者签名),
            右键点击 App → 打开,确认一次即可。仅支持 Apple Silicon (arm64) Mac。

            **命令行版**

            ```bash
            pip install codex_inspector-*.whl
            codex-inspector --help
            ```
