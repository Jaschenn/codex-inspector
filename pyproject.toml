[project]
name = "codex-inspector"
version = "0.1.0"
description = "只读诊断工具:查看正在运行的 codex 进程及其生效配置"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jiaao Chen" }]
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=5.9",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/Jaschenn/codex-inspector"
Issues = "https://github.com/Jaschenn/codex-inspector/issues"

[project.scripts]
codex-inspector = "codex_inspector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# 显式列出白名单,不依赖 hatchling 猜测(或指望它按 .gitignore 过滤)——这是个
# monorepo 式的仓库,同目录下还有 macapp/ 的 Swift 源码和构建产物,sdist 只该打
# Python 包本身。
include = [
    "/codex_inspector",
    "/README.md",
    "/LICENSE",
]

[tool.ruff.lint]
# 只挑 pyflakes(未用的 import/变量、未定义名字这类真错误)。故意不开
# pycodestyle 的行宽检查——这份代码里中文注释很多,行宽噪音远大于信号;也不开
# flake8-blind-except 之类的风格插件——per-process 分析故意 catch Exception,
# 是为了"探测失败也不能拖垮整份报告"(见 README),不是疏忽。
select = ["F"]
